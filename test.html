<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Find My Clone</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Gun.js (Realtime DB) -->
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>

    <style>
        :root {
            --apple-blue: #007AFF;
            --bg-glass: rgba(255, 255, 255, 0.85);
        }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; background: #f2f2f7; }
        
        #map { height: 100%; width: 100%; z-index: 1; }

        /* ボトムパネル (iPhoneの「探す」風) */
        #panel {
            position: fixed; bottom: 0; left: 0; right: 0; height: 35%;
            background: var(--bg-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 1000; border-top-left-radius: 20px; border-top-right-radius: 20px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; transition: height 0.3s;
        }
        .handle { width: 40px; height: 5px; background: #ccc; margin: 10px auto; border-radius: 10px; }
        .panel-header { padding: 0 20px 10px; border-bottom: 1px solid #ddd; font-weight: bold; font-size: 1.2rem; }
        #user-list { flex: 1; overflow-y: auto; padding: 0; margin: 0; list-style: none; }
        .user-item { display: flex; align-items: center; padding: 15px 20px; border-bottom: 0.5px solid #eee; }
        .user-avatar { width: 45px; height: 45px; border-radius: 50%; background: #ddd; margin-right: 15px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 20px; }
        .user-info { flex: 1; }
        .user-name { font-weight: 600; font-size: 16px; margin: 0; }
        .user-dist { font-size: 13px; color: #888; margin: 0; }

        /* マーカーのデザイン */
        .custom-marker { border: 3px solid white; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .my-location-dot { width: 15px; height: 15px; background: var(--apple-blue); border: 2px solid white; border-radius: 50%; box-shadow: 0 0 10px var(--apple-blue); }

        /* ステータスバー */
        #status-pill {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 2000; background: rgba(0,0,0,0.7); color: white;
            padding: 8px 16px; border-radius: 20px; font-size: 12px; white-space: nowrap; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="status-pill">位置情報を同期中...</div>
    <div id="map"></div>

    <div id="panel">
        <div class="handle"></div>
        <div class="panel-header">デバイス</div>
        <ul id="user-list">
            <!-- ユーザーがここに追加される -->
        </ul>
    </div>

    <script>
        // --- 設定 ---
        const roomID = btoa(window.location.origin + window.location.pathname).substring(0, 16);
        const myID = Math.random().toString(36).substring(2, 7);
        const myColor = ["#FF3B30", "#34C759", "#007AFF", "#AF52DE", "#FF9500"][Math.floor(Math.random() * 5)];
        const myName = "ゲスト " + myID;

        // --- 地図初期化 ---
        const map = L.map('map', { zoomControl: false }).setView([35.6895, 139.6917], 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // --- データ管理 ---
        const gun = Gun(['https://gun-manhattan.herokuapp.com/gun']);
        const room = gun.get('find-my-clone-room-' + roomID);
        const users = {}; // ユーザーデータ保持

        // --- 距離計算 (Haversine法) ---
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const d = R * c;
            return d > 1 ? d.toFixed(1) + " km" : Math.round(d * 1000) + " m";
        }

        let myPos = null;

        // --- 位置取得 ---
        navigator.geolocation.watchPosition(pos => {
            const { latitude, longitude, accuracy } = pos.coords;
            myPos = [latitude, longitude];

            // 初回移動
            if (!users[myID]) map.panTo(myPos);

            // 自分のデータを送信
            room.get(myID).put({
                id: myID,
                name: myName + " (自分)",
                lat: latitude,
                lng: longitude,
                acc: accuracy,
                color: myColor,
                time: Date.now()
            });

            document.getElementById('status-pill').innerText = "位置を共有中：部屋 " + roomID;
        }, err => {
            document.getElementById('status-pill').innerText = "位置情報の許可が必要です";
        }, { enableHighAccuracy: true });

        // --- 他ユーザーの受信と更新 ---
        room.map().on((data, id) => {
            if (!data || !data.lat) return;
            
            // 10分以上更新がないユーザーを無視
            if (Date.now() - data.time > 600000) {
                removeUser(id);
                return;
            }

            updateUserUI(id, data);
        });

        function updateUserUI(id, data) {
            const isMe = (id === myID);
            
            // マーカー更新
            if (!users[id]) {
                users[id] = {
                    marker: L.marker([data.lat, data.lng], {
                        icon: L.divIcon({
                            className: 'custom-div-icon',
                            html: isMe ? `<div class="my-location-dot"></div>` : 
                                         `<div class="user-avatar" style="background:${data.color}; width:30px; height:30px; font-size:12px; border:2px solid white;">${data.name[0]}</div>`,
                            iconSize: [30, 30],
                            iconAnchor: [15, 15]
                        })
                    }).addTo(map),
                    circle: L.circle([data.lat, data.lng], { radius: data.acc, weight: 1, fillOpacity: 0.1, color: isMe ? '#007AFF' : data.color }).addTo(map)
                };
            } else {
                users[id].marker.setLatLng([data.lat, data.lng]);
                users[id].circle.setLatLng([data.lat, data.lng]).setRadius(data.acc);
            }

            // リスト更新
            refreshList();
        }

        function removeUser(id) {
            if (users[id]) {
                map.removeLayer(users[id].marker);
                map.removeLayer(users[id].circle);
                delete users[id];
                refreshList();
            }
        }

        function refreshList() {
            const listEl = document.getElementById('user-list');
            listEl.innerHTML = "";

            // Gunから全ユーザーデータを取得してリスト化
            room.once((allData) => {
                Object.keys(users).forEach(id => {
                    room.get(id).once(d => {
                        if(!d) return;
                        const dist = (myPos && id !== myID) ? getDistance(myPos[0], myPos[1], d.lat, d.lng) : "現在地";
                        
                        const li = document.createElement('li');
                        li.className = "user-item";
                        li.onclick = () => map.flyTo([d.lat, d.lng], 17);
                        li.innerHTML = `
                            <div class="user-avatar" style="background:${d.color}">${d.name[0]}</div>
                            <div class="user-info">
                                <p class="user-name">${d.name}</p>
                                <p class="user-dist">${dist} • ${new Date(d.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}に更新</p>
                            </div>
                        `;
                        listEl.appendChild(li);
                    });
                });
            });
        }

        // 定期的に古いユーザーを掃除
        setInterval(() => {
            const now = Date.now();
            Object.keys(users).forEach(id => {
                room.get(id).once(d => {
                    if (d && now - d.time > 10000) { // 10秒更新がなければオフライン気味
                        // 実際にはもっと長くても良い
                    }
                });
            });
        }, 5000);

    </script>
</body>
</html>
